</style></head><body><div id="loading">3Dエンジンを読み込み中…（Three.jsのCDN接続が必要です）</div><div id="hud"><h1>CUBE CORE DUNGEON <small>v0.8</small></h1><p>xDimension 構想実験 / 独立プロトタイプ</p><p id="status">キューブの内部を探索せよ</p></div><div id="info">吸着面: <b id="face">BOTTOM</b><br>敵の残HP: <b id="enemyhp">—</b><br>オーブ切替: <b id="cool">READY</b><br>面の切替: <b id="turns">0</b> 回</div><div id="cameraControls"><button id="cameraToggle" type="button">CAMERA: FIXED</button></div><div id="cross">＋</div><div id="message"></div><div id="hint">WASD / 矢印: 移動（角を越えると隣の面へ） ｜ マウスで中央オーブの面をクリック / 1〜6: 床を選択 ｜ Space: 狙った面を発射 ｜ C: カメラ切替 ｜ R: リセット</div><div id="mobile"><div class="cluster"><span class="empty"></span><button data-key="ArrowUp">▲</button><span class="empty"></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button class="fire" id="fire">ORB<br>SHOT</button></div><script type="module">

let cameraMode='fixed';const fixedPosition=new THREE.Vector3(22,19,24);const fixedLook=new THREE.Vector3(0,0,0);const cameraToggle=$('cameraToggle');function toggleCamera(){cameraMode=cameraMode==='fixed'?'follow':'fixed';cameraToggle.textContent='CAMERA: '+cameraMode.toUpperCase();if(cameraMode==='fixed'){camera.position.copy(fixedPosition);camera.up.set(0,1,0);camera.lookAt(fixedLook)}}cameraToggle.addEventListener('click',toggleCamera);const keys=new Set();let surfaceSquash=0, locomotion=0, animatedStretch=0, adhesiveSquash=0, forwardLean=0;let face=0,gravityFace=0,px=-3,pv=-3,cool=0,turns=0,flashes=[],intro=true;const onFace=(f,x,y,out)=>out.copy(V(f.u).multiplyScalar(x)).addScaledVector(V(f.v),y).addScaledVector(V(f.n),-H+.65);const notify=s=>{const el=$('message');el.textContent=s;el.style.opacity='1';clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.style.opacity='0',1600)};

    .addScaledVector(controlForward,iy).normalize().multiplyScalar(distance);

const desiredCam=new THREE.Vector3(), look=new THREE.Vector3(), up=new THREE.Vector3();const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04);cool=Math.max(0,cool-dt);$('cool').textContent=cool?cool.toFixed(1)+' s':'READY';let ix=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0),iy=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0);const speed=(keys.has('ShiftLeft')?7:4.5)*dt;crossSurfaceEdge(ix,iy,speed);const walkingFace=faces[face],walkingN=V(walkingFace.n),n=walkingN;onFace(walkingFace,px,pv,player.position);// A surface normal defines the slime's head-up direction. The direction of

  .addScaledVector(controlForward,iy);
